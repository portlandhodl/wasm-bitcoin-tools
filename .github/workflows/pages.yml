# Publishes the site to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          # bsdtar extracts Alpine's kernel and initramfs
          sudo apt-get install -y libarchive-tools

      - name: Build the emulator, stage Alpine and Bitcoin Core
        run: ./scripts/setup.sh

      - name: Assemble site
        run: node scripts/build-site.mjs --out _site
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
