# Publishes the site to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the offline release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          # bsdtar extracts Alpine's kernel and initramfs
          sudo apt-get install -y libarchive-tools

      - name: Build the emulator, stage Alpine and Bitcoin Core
        run: ./scripts/setup.sh

      - name: Assemble site
        run: node scripts/build-site.mjs --out _site
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Build the single-file offline versions
        run: node scripts/build-offline.mjs --out _offline
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Too large for Pages (~117 MB each): they go on the "offline" release, whose tag follows master
      - name: Publish the offline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin "$GITHUB_SHA:refs/tags/offline"
          notes="Single-file offline builds of each tool, from $GITHUB_SHA. Download one, check it against SHA256SUMS, audit it, then open it on an air-gapped computer straight from disk. Never use real bitcoins."
          gh release view offline >/dev/null 2>&1 || gh release create offline --title "Offline single-file builds" --notes "$notes" --latest
          gh release edit offline --notes "$notes"
          gh release upload offline _offline/* --clobber

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
